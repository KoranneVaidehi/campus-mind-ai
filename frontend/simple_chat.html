<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628, #0f2038);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: rgba(21, 40, 68, 0.9);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 135, 94, 0.3);
        }
        .chat-header {
            padding: 20px 24px;
            background: rgba(10, 22, 40, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chat-header h1 {
            color: #d4875e;
            font-size: 1.8rem;
            font-family: Georgia, serif;
            font-style: italic;
        }
        .chat-header p {
            color: #9baec8;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            margin-bottom: 8px;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message-content {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user .message-content {
            background: linear-gradient(135deg, #d4875e, #e8956a);
            color: #0a1628;
            border-radius: 18px 18px 4px 18px;
        }
        .ai .message-content {
            background: rgba(26, 50, 82, 0.9);
            color: #e8edf2;
            border-radius: 18px 18px 18px 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #5eb5a6;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .input-area {
            padding: 16px 20px;
            background: rgba(10, 22, 40, 0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(21, 40, 68, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #d4875e;
        }
        .input-area button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #5eb5a6, #6ec4b5);
            border: none;
            border-radius: 30px;
            color: #0a1628;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-area button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(94, 181, 166, 0.4);
        }
        .language-badge {
            display: inline-block;
            background: rgba(94, 181, 166, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-top: 6px;
            color: #5eb5a6;
        }
        .sources {
            font-size: 10px;
            color: #9baec8;
            margin-top: 6px;
        }
        .error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>◆ Nexus AI</h1>
            <p>Multilingual Academic Assistant | English, हिन्दी, मराठी, ગુજરાતી, தமிழ், తెలుగు</p>
        </div>
        
        <div class="messages-area" id="messagesArea">
            <div class="message ai">
                <div class="message-content">
                    Hello! I'm Nexus. Ask me anything about your PDFs in any language!
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your question here..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send ↑</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let isTyping = false;
        
        function addMessage(text, sender, language = null, sources = []) {
            const messagesArea = document.getElementById('messagesArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            let contentHTML = `<div class="message-content">${text}`;
            
            if (language && sender === 'ai') {
                const langNames = {en:'English', hi:'Hindi', mr:'Marathi', gu:'Gujarati', ta:'Tamil', te:'Telugu'};
                contentHTML += `<div class="language-badge">🌐 ${langNames[language] || language}</div>`;
            }
            
            if (sources.length > 0) {
                contentHTML += `<div class="sources">📚 Sources: ${sources.join(', ')}</div>`;
            }
            
            contentHTML += `</div>`;
            messageDiv.innerHTML = contentHTML;
            messagesArea.appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth' });
        }
        
        function showTyping() {
            const messagesArea = document.getElementById('messagesArea');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `<div class="message-content"><div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
            messagesArea.appendChild(typingDiv);
            typingDiv.scrollIntoView({ behavior: 'smooth' });
        }
        
        function hideTyping() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) typingDiv.remove();
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            showTyping();
            
            try {
                console.log('Sending:', message);
                
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Response:', data);
                
                hideTyping();
                
                // Add AI response
                let responseText = data.response || 'Sorry, I could not process that.';
                addMessage(responseText, 'ai', data.detected_language, data.sources || []);
                
            } catch (error) {
                console.error('Error:', error);
                hideTyping();
                addMessage(`❌ Connection error: ${error.message}. Make sure backend is running on ${API_URL}`, 'ai');
            }
        }
        
        // Test backend connection on load
        async function testConnection() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                console.log('Backend status:', data);
                if (data.chatbot_ready) {
                    addMessage('✅ Backend connected! Ask me anything.', 'ai');
                }
            } catch (error) {
                console.error('Backend not reachable:', error);
                addMessage('⚠️ Backend not reachable. Please start the backend server with: python api_server.py', 'ai');
            }
        }
        
        // Run connection test
        testConnection();
    </script>
</body>
</html>
