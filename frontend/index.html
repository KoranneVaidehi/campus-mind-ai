<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nexus AI · Multilingual Academic Assistant</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Copy all styles from your HTML here - same as before */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #0a1628;
      --bg-panel: #0f2038;
      --surface: #152844;
      --surface-light: #1a3252;
      --text-primary: #e8edf2;
      --text-secondary: #9baec8;
      --accent-copper: #d4875e;
      --accent-teal: #5eb5a6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Fraunces', serif;
      --radius-l: 2rem;
      --radius-m: 1.25rem;
      --radius-sm: 0.85rem;
    }
    body {
      font-family: var(--font-sans);
      background: #0a1628;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      color: var(--text-primary);
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 15% 20%, rgba(212, 135, 94, 0.1) 0%, transparent 45%),
                  radial-gradient(circle at 85% 75%, rgba(94, 181, 166, 0.08) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }
    .app-container {
      width: 100%;
      max-width: 1250px;
      height: 90vh;
      min-height: 700px;
      background: rgba(15, 32, 56, 0.8);
      backdrop-filter: blur(30px);
      border-radius: var(--radius-l);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      cursor: pointer;
    }
    .logo-icon { font-size: 2rem; background: linear-gradient(135deg, var(--accent-copper), #f0b894); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo-text { font-family: var(--font-serif); font-style: italic; font-weight: 350; font-size: 1.7rem; background: linear-gradient(to right, #e8edf2, #c5d1e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-item {
      font-weight: 500; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer;
      padding: 0.5rem 1rem; border-radius: 2rem; background: none; border: none;
    }
    .nav-item:hover { color: var(--accent-copper); background: rgba(212, 135, 94, 0.1); }
    .nav-item.active { color: var(--accent-copper); background: rgba(212, 135, 94, 0.15); }
    .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; overflow-y: auto; }
    .auth-card {
      background: rgba(21, 40, 68, 0.6); backdrop-filter: blur(20px); border-radius: var(--radius-m);
      padding: 2.5rem 2.2rem; width: 100%; max-width: 420px; border: 1px solid rgba(212, 135, 94, 0.2);
    }
    .auth-title { font-family: var(--font-serif); font-style: italic; font-size: 2.2rem; margin-bottom: 1.5rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .input-label { font-size: 0.75rem; text-transform: uppercase; color: var(--accent-teal); }
    .input-field {
      background: rgba(10, 22, 40, 0.6); border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-sm); padding: 0.9rem 1.2rem; color: white; outline: none;
    }
    .input-field:focus { border-color: var(--accent-copper); }
    .auth-btn {
      background: linear-gradient(135deg, var(--accent-copper), #e8956a); border: none;
      border-radius: 3rem; padding: 1rem; font-weight: 600; color: #0a1628; cursor: pointer;
      width: 100%; margin-top: 1rem;
    }
    .chat-layout { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 800px; margin: 0 auto; }
    .messages-area { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .message-bubble { display: flex; gap: 0.7rem; }
    .message-bubble.user { justify-content: flex-end; }
    .bubble-content {
      background: var(--surface-light); padding: 0.8rem 1.3rem; border-radius: 1.5rem;
      max-width: 70%; line-height: 1.5; font-size: 0.9rem;
    }
    .user .bubble-content { background: linear-gradient(135deg, #d4875e, #e8956a); color: #0a1628; }
    .typing-indicator { display: flex; gap: 0.25rem; padding: 0.3rem; }
    .typing-dot { width: 7px; height: 7px; background: var(--accent-teal); border-radius: 50%; animation: bounce 1.4s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .chat-input-area { display: flex; gap: 0.8rem; padding: 1rem; border-top: 1px solid var(--border-subtle); }
    .chat-input {
      flex: 1; background: rgba(21, 40, 68, 0.6); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3rem; padding: 0.8rem 1.5rem; color: white; outline: none;
    }
    .send-btn {
      background: linear-gradient(135deg, var(--accent-teal), #6ec4b5); border: none;
      border-radius: 50%; width: 44px; height: 44px; cursor: pointer;
    }
    .language-badge {
      display: inline-block; background: rgba(94, 181, 166, 0.2); padding: 2px 8px;
      border-radius: 12px; font-size: 0.7rem; margin-left: 8px; color: var(--accent-teal);
    }
    .sources-list { font-size: 0.7rem; color: var(--text-secondary); margin-top: 5px; }
    .home-greeting { text-align: center; }
    .home-greeting h2 { font-family: var(--font-serif); font-style: italic; font-size: 3rem; }
    .home-actions { display: flex; gap: 1.2rem; margin-top: 2rem; justify-content: center; }
    .home-btn { padding: 0.9rem 2.2rem; border-radius: 3rem; font-weight: 600; cursor: pointer; border: 2px solid var(--accent-copper); background: transparent; color: var(--accent-copper); }
    .home-btn.filled { background: linear-gradient(135deg, var(--accent-copper), #e8956a); border-color: transparent; color: #0a1628; }
    .loading-screen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; }
    .loading-text { font-family: var(--font-serif); font-size: 2rem; color: var(--accent-copper); }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen"><div class="loading-text">Nexus</div></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // API Configuration
    const API_URL = 'http://localhost:8000';
    
    // Logo Component
    const NexusLogo = () => (
      <div className="logo-area">
        <span className="logo-icon">◆</span>
        <span className="logo-text">Nexus</span>
      </div>
    );
    
    // Chat Interface with Real API
    const ChatInterface = ({ user, onLogout }) => {
      const [messages, setMessages] = useState([
        { id: 0, sender: 'ai', text: `Hello${user.name ? ' ' + user.name : ''}! I'm Nexus, your multilingual academic assistant. Ask me anything about your PDFs in English, Hindi, Marathi, Gujarati, Tamil, or Telugu!` }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [currentLang, setCurrentLang] = useState(null);
      const messagesEndRef = useRef(null);
      
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isTyping]);
      
      const sendMessage = async (userMessage) => {
        setIsTyping(true);
        try {
          const response = await fetch(`${API_URL}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userMessage })
          });
          
          const data = await response.json();
          setCurrentLang(data.detected_language);
          
          let responseText = data.response;
          if (data.sources && data.sources.length > 0) {
            responseText += `\n\n📚 Sources: ${data.sources.join(', ')}`;
          }
          
          setMessages(prev => [...prev, { 
            id: Date.now(), 
            sender: 'ai', 
            text: responseText,
            language: data.detected_language
          }]);
        } catch (error) {
          setMessages(prev => [...prev, { 
            id: Date.now(), 
            sender: 'ai', 
            text: `Sorry, I'm having trouble connecting. Please make sure the backend server is running on ${API_URL}` 
          }]);
        }
        setIsTyping(false);
      };
      
      const handleSend = async () => {
        if (!input.trim()) return;
        const userMsg = input.trim();
        setMessages(prev => [...prev, { id: Date.now(), sender: 'user', text: userMsg }]);
        setInput('');
        await sendMessage(userMsg);
      };
      
      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };
      
      const languageNames = { en: '🇬🇧 English', hi: '🇮🇳 Hindi', mr: '🇮🇳 Marathi', gu: '🇮🇳 Gujarati', ta: '🇮🇳 Tamil', te: '🇮🇳 Telugu' };
      
      return (
        <div className="chat-layout">
          <div className="messages-area">
            {messages.map(msg => (
              <div key={msg.id} className={`message-bubble ${msg.sender}`}>
                <div className="bubble-content">
                  {msg.text}
                  {msg.language && msg.sender === 'ai' && (
                    <div className="language-badge">{languageNames[msg.language] || msg.language}</div>
                  )}
                </div>
              </div>
            ))}
            {isTyping && (
              <div className="message-bubble ai">
                <div className="bubble-content">
                  <div className="typing-indicator">
                    <span className="typing-dot"></span>
                    <span className="typing-dot"></span>
                    <span className="typing-dot"></span>
                  </div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>
          
          <div className="chat-input-area">
            <input 
              className="chat-input" 
              placeholder="Ask in English, हिन्दी, मराठी, ગુજરાતી, தமிழ், తెలుగు..." 
              value={input} 
              onChange={e => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
            />
            <button className="send-btn" onClick={handleSend}>↑</button>
          </div>
        </div>
      );
    };
    
    // Sign In Component
    const SignIn = ({ onSwitch, onLogin }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const handleSubmit = (e) => {
        e.preventDefault();
        if (email && password) onLogin(email, password);
        else alert('Please fill in all fields');
      };
      
      return (
        <div className="auth-card">
          <div className="auth-title">Welcome back</div>
          <form onSubmit={handleSubmit}>
            <div className="input-group">
              <span className="input-label">Email</span>
              <input className="input-field" type="email" placeholder="alex@nexus.ai" value={email} onChange={e => setEmail(e.target.value)} />
            </div>
            <div className="input-group">
              <span className="input-label">Password</span>
              <input className="input-field" type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} />
            </div>
            <button type="submit" className="auth-btn">Sign in</button>
          </form>
          <div className="toggle-text" style={{textAlign: 'center', marginTop: '1rem'}}>
            No account? <button className="toggle-link" onClick={onSwitch} style={{background: 'none', border: 'none', color: 'var(--accent-teal)', cursor: 'pointer'}}>Create one</button>
          </div>
        </div>
      );
    };
    
    // Sign Up Component
    const SignUp = ({ onSwitch, onRegister }) => {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      
      const handleSubmit = (e) => {
        e.preventDefault();
        if (name && email && password) onRegister(name, email, password);
        else alert('Please fill in all fields');
      };
      
      return (
        <div className="auth-card">
          <div className="auth-title">Join Nexus</div>
          <form onSubmit={handleSubmit}>
            <div className="input-group">
              <span className="input-label">Name</span>
              <input className="input-field" placeholder="Sasha Chen" value={name} onChange={e => setName(e.target.value)} />
            </div>
            <div className="input-group">
              <span className="input-label">Email</span>
              <input className="input-field" type="email" placeholder="sasha@nexus.ai" value={email} onChange={e => setEmail(e.target.value)} />
            </div>
            <div className="input-group">
              <span className="input-label">Password</span>
              <input className="input-field" type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} />
            </div>
            <button type="submit" className="auth-btn">Create account</button>
          </form>
          <div className="toggle-text" style={{textAlign: 'center', marginTop: '1rem'}}>
            Already have an account? <button className="toggle-link" onClick={onSwitch} style={{background: 'none', border: 'none', color: 'var(--accent-teal)', cursor: 'pointer'}}>Sign in</button>
          </div>
        </div>
      );
    };
    
    // Home Page
    const HomePage = ({ onNavigate }) => (
      <div className="home-greeting">
        <h2>ask deeper.</h2>
        <p>Multilingual AI that understands English, Hindi, Marathi, Gujarati, Tamil & Telugu.</p>
        <div className="home-actions">
          <button className="home-btn" onClick={() => onNavigate('signin')}>Sign in</button>
          <button className="home-btn filled" onClick={() => onNavigate('signup')}>Get started</button>
        </div>
      </div>
    );
    
    // Main App
    const App = () => {
      const [view, setView] = useState('home');
      const [user, setUser] = useState(null);
      
      useEffect(() => {
        const loadingEl = document.getElementById('loading');
        if (loadingEl) loadingEl.style.display = 'none';
      }, []);
      
      const handleLogin = (email, password) => { setUser({ email }); setView('chat'); };
      const handleRegister = (name, email, password) => { setUser({ name, email }); setView('chat'); };
      const handleLogout = () => { setUser(null); setView('home'); };
      
      const renderContent = () => {
        if (user && view === 'chat') return <ChatInterface user={user} onLogout={handleLogout} />;
        switch (view) {
          case 'signin': return <SignIn onSwitch={() => setView('signup')} onLogin={handleLogin} />;
          case 'signup': return <SignUp onSwitch={() => setView('signin')} onRegister={handleRegister} />;
          default: return <HomePage onNavigate={setView} />;
        }
      };
      
      return (
        <div className="app-container">
          <div className="app-header">
            <div onClick={() => !user && setView('home')} style={{cursor: 'pointer'}}><NexusLogo /></div>
            <div className="nav-links">
              {!user ? (
                <>
                  <button className={`nav-item ${view === 'home' ? 'active' : ''}`} onClick={() => setView('home')}>Home</button>
                  <button className={`nav-item ${view === 'signin' ? 'active' : ''}`} onClick={() => setView('signin')}>Sign in</button>
                  <button className={`nav-item ${view === 'signup' ? 'active' : ''}`} onClick={() => setView('signup')}>Sign up</button>
                </>
              ) : (
                <>
                  <button className="nav-item active" onClick={() => setView('chat')}>Chat</button>
                  <button className="nav-item" onClick={handleLogout}>Log out</button>
                </>
              )}
            </div>
          </div>
          <div className="main-content">{renderContent()}</div>
        </div>
      );
    };
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
